# Alembic configuration for the audit schema (rules.md R-26: no ad-hoc DDL, on any tier).
#
# Run from anywhere:
#   DATABASE_URL=postgresql://... alembic -c audit/migrations/alembic.ini upgrade head
#
# There is NO sqlalchemy.url here. A committed connection string is either wrong on every tier or a
# secret in Git (rules.md R-34); env.py reads DATABASE_URL and refuses to start without it. The same
# variable name serves both tiers — the tier is configuration, never a code branch (rules.md R-04).

[alembic]
# This ini file lives inside the migration directory rather than above it, so script_location is the
# directory that contains env.py: here.
script_location = %(here)s

# Makes schema_contract.py importable by the revision modules regardless of the working directory
# Alembic is invoked from. Without this, `alembic upgrade head` works from audit/migrations and fails
# from the repo root, which is exactly the difference between a developer's laptop and CI.
prepend_sys_path = %(here)s

# A readable slug, not a random hex id. `migration_head` is reported by GET /api/v1/version as part of
# the parity set (contracts/openapi.yaml VersionInfo), and somebody has to compare two tiers by eye.
file_template = %%(rev)s_%%(slug)s

# Timestamps in the revision header are UTC. Local time in a file that documents when evidence
# structure changed is a needless ambiguity.
timezone = UTC

# Warn rather than truncate long slugs (rules.md R-52: never silently truncate).
truncate_slug_length = 60

sqlalchemy.url =

[post_write_hooks]
# Deliberately empty. A formatter that rewrites a landed migration changes the text of a historical
# record; the review artifact and the applied artifact must be the same bytes.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# INFO here would echo every DDL statement, which is useful. It is left at WARNING because the
# statements are already reviewable with `alembic ... upgrade head --sql`, and a log that repeats the
# migration file adds noise to the one output a reviewer should read.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

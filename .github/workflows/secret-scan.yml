# secret-scan — a required check on `main` (rules.md R-34, R-57).
#
# THE JOB NAME IS LOAD-BEARING
# ---------------------------
# Branch protection requires the context `secret-scan` (aws-setup-instructions.md section 3.4). Branch
# protection matches the *job* name, so the job below is named exactly that. Renaming it does not
# disable the gate loudly — it makes protection wait forever for a context that never reports, and the
# first person blocked by an unmergeable PR will be tempted to remove the requirement instead.
#
# WHY A DETECTOR WRITTEN HERE RATHER THAN AN OFF-THE-SHELF ACTION
# --------------------------------------------------------------
# gitleaks and truffleHog are better than this at generic credential shapes, and if the team wants one
# it should be added ALONGSIDE. Two reasons it is not the primary here:
#
#   1. gitleaks-action v2 requires a GITLEAKS_LICENSE secret for organisation-owned repositories. A
#      required check that fails on a missing licence key is a required check someone disables on day
#      one, and this repository is private and organisation-owned.
#   2. Half of what must not be committed here is project-specific and no generic scanner knows about
#      it: a real 12-digit AWS account id (rules.md R-34 requires every placeholder in every document to
#      be obviously fake), a populated value for one of the four `sih26104/*` Secrets Manager keys, a
#      committed mkcert private key, a committed `gateway/.env`. Those are the leaks this project would
#      actually produce, because they are the values people have in a terminal while following
#      aws-setup-instructions.md.
#
# THE DETECTOR TESTS ITSELF ON EVERY RUN
# --------------------------------------
# The `self-test` step plants known-fake credentials in a temporary directory and asserts the detector
# fires on every one of them, then deletes them. If a future edit to a pattern breaks matching, THIS
# check goes red — instead of going green while checking nothing. A silently-stopped scanner is worse
# than no scanner, because it produces a passing required check that everyone trusts. A broken gate gets
# bypassed; a failing gate gets fixed.
#
# NOTE ON SCOPE, HONESTLY (rules.md R-01, R-52)
# --------------------------------------------
# This finds committed credentials that match a known shape. It does not find: a secret with no
# recognisable shape (a plain passphrase), a secret in a binary or minified file, a secret in a git
# object no longer reachable from any ref, or a secret already pushed to a third party. And a green run
# does not un-leak anything: once a key reaches GitHub it must be rotated, not just deleted — deleting a
# committed key rewrites nothing and the object stays in the history and in every clone.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NAME MUST STAY `secret-scan` — see the header. This is a required check on `main`.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    # No `id-token: write`, no AWS region. A job whose whole purpose is finding credentials has no
    # business being able to assume one.
    steps:
      # Exact published versions, not commit SHAs — see the pinning note in gateway-ci.yml.
      - uses: actions/checkout@v4.2.2
        with:
          # Full history. A key that was committed and then "removed" in a later commit is still in the
          # history and still in every clone; deleting the line does not un-leak it. Without
          # fetch-depth: 0 the history scan below silently checks one commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------------------------------------
      # The detector is written to the runner's temp directory, not to scripts/. It is deliberately not a
      # committed script: a scanner in scripts/ is a file people edit to make their PR pass, and the
      # edit-to-pass path for a security gate should require touching the workflow that enforces it.
      #
      # The patterns are written so that NO LITERAL IN THIS FILE MATCHES THEM. That matters because the
      # scan covers every tracked file including this one. The self-test fixtures below are assembled
      # from concatenated fragments at runtime for the same reason — a workflow that plants a real
      # matching literal in a tracked file makes its own scanner fire forever, and the fix people reach
      # for is to exclude the scanner from the scan, which is a hole.
      # ------------------------------------------------------------------------------------------------
      - name: Write the detector
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          cat > "$RUNNER_TEMP/scan/detect.py" <<'PY'
          #!/usr/bin/env python3
          """Project-specific committed-credential detector for SIH26104.

          Usage:
              detect.py --git                 scan every git-tracked file in the current repository
              detect.py --path DIR            scan every file under DIR (used by the self-test)

          Exit codes:
              0  no finding
              1  at least one finding  (a real result: something must be rotated and removed)
              2  could not run         (never conflated with 0 — an unrun scanner is not a clean scanner)
          """

          from __future__ import annotations

          import argparse
          import math
          import re
          import subprocess
          import sys
          from collections import Counter
          from pathlib import Path

          # --- What is never scanned. ------------------------------------------------------------------
          # Each entry is here because it produces hundreds of hash-shaped strings that are not secrets,
          # and a scanner that reports those is a scanner whose output nobody reads. `package-lock.json`
          # alone carries an `integrity: sha512-...` line per dependency.
          SKIP_DIR_PARTS = frozenset(
              {".git", "node_modules", "__pycache__", ".venv", ".venv-verify", ".venv-ws", "dist",
               "build", ".mypy_cache", ".pytest_cache", ".ruff_cache", "cdk.out", ".claude"}
          )
          SKIP_NAMES = frozenset({"package-lock.json", "yarn.lock", "poetry.lock", "uv.lock"})
          SKIP_SUFFIXES = frozenset(
              {".pyc", ".onnx", ".pth", ".npy", ".wav", ".flac", ".png", ".jpg", ".jpeg", ".gif",
               ".pdf", ".ico", ".woff", ".woff2", ".zip", ".gz", ".tar", ".whl", ".so", ".dll"}
          )
          MAX_BYTES = 2_000_000

          # --- Obviously-fake markers. -----------------------------------------------------------------
          # rules.md R-34 requires every placeholder in this repository to be obviously fake. That rule is
          # what makes this allow-list safe: a value containing one of these is not a credential, and a
          # real credential cannot contain one by accident. If a placeholder is NOT on this list, the
          # right fix is usually to make the placeholder more obviously fake, not to extend the list.
          PLACEHOLDER_MARKERS = (
              "change_me", "changeme", "placeholder", "example", "dummy", "fake", "notreal",
              "redacted", "xxxx", "todo", "tbd", "your-", "your_", "<", "0123456789ab",
              "deadbeef", "aaaaaaaa", "0000000000", "1111111111", "ffffffff",
              "account_id", "accountid", "sha256:...", "insert", "replace",
          )

          # --- Rules. ---------------------------------------------------------------------------------
          # (id, severity, description, pattern)
          # severity "high" = a credential shape. Fails the scan.
          # severity "med"  = project-specific leak of something R-34 names. Fails the scan.
          # severity "low"  = high-entropy value next to a secret-ish keyword. Fails the scan, but this
          #                   is the rule most likely to be a false positive, so its message says so.
          RULES: list[tuple[str, str, str, re.Pattern[str]]] = [
              (
                  "S-01", "high",
                  "AWS access key id",
                  re.compile(r"(?<![A-Z0-9])(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}(?![A-Z0-9])"),
              ),
              (
                  "S-02", "high",
                  "AWS secret access key (40-char base64 next to an aws/secret keyword)",
                  re.compile(
                      r"(?i)(?:aws[_-]?secret[_-]?access[_-]?key|aws[_-]?secret|secret[_-]?access[_-]?key)"
                      r"\W{0,4}([A-Za-z0-9/+=]{40})(?![A-Za-z0-9/+=])"
                  ),
              ),
              (
                  "S-03", "high",
                  "PEM private key block",
                  re.compile(r"-{5}BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-{5}"),
              ),
              (
                  "S-04", "high",
                  "GitHub token",
                  re.compile(r"(?<![A-Za-z0-9_])(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}(?![A-Za-z0-9])"),
              ),
              (
                  "S-05", "high",
                  "GitHub fine-grained personal access token",
                  re.compile(r"github_pat_[A-Za-z0-9_]{60,}"),
              ),
              (
                  "S-06", "high",
                  "JSON Web Token (three base64url segments)",
                  re.compile(r"eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}"),
              ),
              (
                  "S-07", "high",
                  "Slack token",
                  re.compile(r"xox[abposr]-[A-Za-z0-9-]{10,}"),
              ),
              (
                  "S-08", "high",
                  "private key material in an OpenSSH or PuTTY container",
                  re.compile(r"PuTTY-User-Key-File-\d|ssh-rsa AAAAB3NzaC1yc2EA[A-Za-z0-9+/]{100,}"),
              ),
              # --- Project-specific: rules.md R-34 names each of these explicitly. --------------------
              (
                  "S-20", "med",
                  "real 12-digit AWS account id in an ARN or ECR registry host "
                  "(R-34: every identifier in this repository must be an obvious placeholder)",
                  re.compile(
                      r"arn:aws[a-z-]*:[a-z0-9-]*:[a-z0-9-]*:(\d{12}):"
                      r"|(?<![\d.])(\d{12})\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com"
                  ),
              ),
              (
                  "S-21", "med",
                  "a populated value for one of the four sih26104 secrets "
                  "(db-password, ticket-signing-key, hmac-key, audit-chain-key)",
                  re.compile(
                      r"(?i)\b(?:AUDIT_CHAIN_KEY|TICKET_SIGNING_KEY|HMAC_KEY|PSEUDONYM_HMAC_KEY|"
                      r"DB_PASSWORD|POSTGRES_PASSWORD|DATABASE_PASSWORD)\b\s*[:=]\s*"
                      r"['\"]?([^\s'\"#,;)]{8,})"
                  ),
              ),
              (
                  "S-22", "med",
                  "a database URL carrying an inline password",
                  re.compile(
                      r"(?i)(?:postgres(?:ql)?|mysql|mongodb)(?:\+[a-z]+)?://"
                      r"[^\s:/@'\"]+:([^\s:/@'\"]{6,})@"
                  ),
              ),
              (
                  "S-23", "low",
                  "high-entropy value assigned to a secret-shaped name",
                  re.compile(
                      r"(?i)\b(?:secret|passwd|password|token|api[_-]?key|private[_-]?key|"
                      r"credential|signing[_-]?key|chain[_-]?key)\w*\s*[:=]\s*"
                      r"['\"]([A-Za-z0-9+/=_-]{16,})['\"]"
                  ),
              ),
          ]

          # --- Files that must never be tracked at all, regardless of content. ------------------------
          # Content matching cannot catch these: an empty `.env` is not a leak today and is the file the
          # next `docker compose up` fills with real values. .gitignore covers them; this asserts
          # .gitignore was not bypassed with `git add -f`.
          FORBIDDEN_TRACKED = (
              (re.compile(r"(?:^|/)\.env(?:\.[A-Za-z0-9_-]+)?$"),
               "an environment file. Secrets live in Secrets Manager or a git-ignored local .env "
               "(rules.md R-34). A tracked .env is the file that gets real values pasted into it next."),
              (re.compile(r"\.(?:pem|key|p12|pfx|jks|keystore)$"),
               "a certificate/key container. The local mkcert CA and the Caddy key are generated per "
               "machine and are never committed."),
              (re.compile(r"(?:^|/)id_(?:rsa|dsa|ecdsa|ed25519)$"),
               "an SSH private key."),
              (re.compile(r"(?:^|/)\.aws/credentials$|(?:^|/)credentials\.json$"),
               "a cloud credentials file. CI reaches AWS by OIDC only and stores no keys "
               "(rules.md R-55)."),
          )


          def shannon(value: str) -> float:
              if not value:
                  return 0.0
              counts = Counter(value)
              n = len(value)
              return -sum((c / n) * math.log2(c / n) for c in counts.values())


          def looks_like_placeholder(text: str) -> bool:
              low = text.lower()
              if any(marker in low for marker in PLACEHOLDER_MARKERS):
                  return True
              # A value made of one repeated character, or a short run of them, is a fixture. Test suites
              # in this repo use "a" * 64 and "0" * 64 for hashes on purpose.
              stripped = re.sub(r"[^A-Za-z0-9]", "", text)
              if stripped and len(set(stripped)) <= 2:
                  return True
              return False


          def iter_files(paths: list[Path]) -> list[Path]:
              out: list[Path] = []
              for path in paths:
                  if not path.is_file():
                      continue
                  if SKIP_DIR_PARTS & set(path.parts):
                      continue
                  if path.name in SKIP_NAMES or path.suffix.lower() in SKIP_SUFFIXES:
                      continue
                  try:
                      if path.stat().st_size > MAX_BYTES:
                          continue
                  except OSError:
                      continue
                  out.append(path)
              return out


          def tracked_files() -> list[Path]:
              proc = subprocess.run(
                  ["git", "ls-files", "-z"], capture_output=True, text=True, check=False
              )
              if proc.returncode != 0:
                  print(f"detect.py: git ls-files failed: {proc.stderr.strip()}", file=sys.stderr)
                  raise SystemExit(2)
              return [Path(p) for p in proc.stdout.split("\0") if p]


          def scan(files: list[Path]) -> list[tuple[str, str, str, int, str, str]]:
              findings: list[tuple[str, str, str, int, str, str]] = []
              for path in files:
                  try:
                      text = path.read_text(encoding="utf-8", errors="strict")
                  except (UnicodeDecodeError, OSError):
                      continue  # binary or unreadable; SKIP_SUFFIXES catches the known ones
                  for lineno, line in enumerate(text.splitlines(), start=1):
                      if len(line) > 4000:
                          line = line[:4000]
                      for rule_id, severity, description, pattern in RULES:
                          for match in pattern.finditer(line):
                              # Prefer the captured group (the value) over the whole match (which may
                              # include the keyword) when deciding whether this is a placeholder.
                              captured = next((g for g in match.groups() if g), match.group(0))
                              if looks_like_placeholder(match.group(0)) or looks_like_placeholder(captured):
                                  continue
                              if severity == "low" and shannon(captured) < 3.2:
                                  # Below this, the value is something like "password123" or a repeated
                                  # word — still bad practice, but not a credential, and reporting it
                                  # here would bury the real findings.
                                  continue
                              redacted = captured[:4] + "…" + f"[{len(captured)} chars redacted]"
                              findings.append(
                                  (rule_id, severity, description, lineno, str(path), redacted)
                              )
                              break  # one finding per rule per line is enough to act on
              return findings


          def scan_forbidden(files: list[Path]) -> list[tuple[str, str, str, int, str, str]]:
              findings: list[tuple[str, str, str, int, str, str]] = []
              for path in files:
                  posix = path.as_posix()
                  for pattern, why in FORBIDDEN_TRACKED:
                      if pattern.search(posix):
                          findings.append(("S-30", "high", f"tracked file is {why}", 0, posix, "-"))
              return findings


          def main() -> int:
              parser = argparse.ArgumentParser()
              group = parser.add_mutually_exclusive_group(required=True)
              group.add_argument("--git", action="store_true", help="scan git-tracked files")
              group.add_argument("--path", type=Path, help="scan everything under this directory")
              parser.add_argument("--quiet", action="store_true")
              args = parser.parse_args()

              if args.git:
                  candidates = tracked_files()
                  findings = scan_forbidden(candidates) + scan(iter_files(candidates))
                  scanned = len(iter_files(candidates))
              else:
                  candidates = sorted(p for p in args.path.rglob("*") if p.is_file())
                  findings = scan(iter_files(candidates))
                  scanned = len(iter_files(candidates))

              if not args.quiet:
                  print(f"detect.py: scanned {scanned} file(s), {len(RULES)} content rules")

              if not findings:
                  return 0

              print()
              print("=" * 96)
              print(f"secret-scan: {len(findings)} FINDING(S)")
              print("=" * 96)
              for rule_id, severity, description, lineno, path, redacted in findings:
                  where = f"{path}:{lineno}" if lineno else path
                  print(f"  [{rule_id}/{severity}] {where}")
                  print(f"      {description}")
                  print(f"      value: {redacted}")
              print()
              print("WHAT TO DO, IN THIS ORDER:")
              print("  1. ROTATE the credential. It is on GitHub. Deleting the line does not un-leak it:")
              print("     the object stays in the history and in every clone anyone already made.")
              print("  2. Remove it from the working tree and put the real value in AWS Secrets Manager")
              print("     (or a git-ignored local .env). rules.md R-34.")
              print("  3. Only then rewrite history, if you decide it is worth it. Step 1 is the one that")
              print("     matters; step 3 without step 1 is theatre.")
              print()
              print("If a finding is a false positive, make the placeholder OBVIOUSLY fake — R-34 requires")
              print("that anyway — rather than widening the detector's allow-list.")
              return 1


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except KeyboardInterrupt:
                  raise SystemExit(2) from None
          PY
          python -c "import ast,os,sys; ast.parse(open(os.environ['RUNNER_TEMP']+'/scan/detect.py').read())"
          echo "detector written and parses"

      # ------------------------------------------------------------------------------------------------
      # SELF-TEST. This is the step that keeps the gate honest.
      #
      # Every fixture is assembled from fragments so that no literal in this tracked file matches any
      # rule — otherwise the scanner would fire on its own workflow, and the "fix" would be to exclude
      # itself from the scan.
      #
      # It asserts both directions:
      #   POSITIVE — every planted fake credential is found. A pattern that silently stopped matching
      #              turns this required check green while it checks nothing.
      #   NEGATIVE — the obviously-fake placeholders that rules.md R-34 REQUIRES documents to use are not
      #              reported. A scanner that flags `CHANGE_ME_...` and `<ORG>` produces a wall of noise
      #              on every PR, and a noisy gate gets ignored and then disabled.
      # ------------------------------------------------------------------------------------------------
      - name: Self-test the detector (must fire on planted fakes, must not fire on placeholders)
        run: |
          set -euo pipefail
          FIX="$RUNNER_TEMP/selftest"
          rm -rf "$FIX" && mkdir -p "$FIX"

          python - "$FIX" <<'PY'
          import sys
          from pathlib import Path

          fixture_dir = Path(sys.argv[1])

          # Fragments, joined at runtime. Nothing below exists as a matching literal in the workflow file.
          A = "AKIA"
          positives = {
              # EXACTLY 16 characters after the 4-character prefix. A real AWS access key id is 20
              # characters, and S-01 ends with `(?![A-Z0-9])` so it will NOT match a 21-character
              # look-alike. That trailing boundary is deliberate and must not be relaxed to make a
              # fixture pass — it is what stops S-01 firing on every 64-character hex digest in this
              # repository. (Found by running this self-test: a 17-character suffix here made S-01 the one
              # rule that silently never fired.)
              "aws_key.txt":      A + "Q3RSTUVWXYZ23456",
              "aws_secret.env":   "AWS_SECRET_ACCESS_KEY=" + "wJz9" + "utnFEMI/K7MDENG/bPxRfiCYnVBGRJnQ7fD2",
              "pem.txt":          "-----" + "BEGIN RSA PRIVATE KEY" + "-----\nMIIBOgIBAAJBAK7h9",
              "gh_token.txt":     "ghp" + "_" + "9sQ2mV7pL4xR6tY1uI3oP5aS8dF0gH2jK4lZ",
              "jwt.txt":          "ey" + "JhbGciOiJIUzI1NiJ9." + "ey" + "JzdWIiOiI5OTk5OTkifQ.7Qm3Vx9LpR2tY6uI",
              "slack.txt":        "xox" + "b-" + "9427163058-Wq7ZmP3rT",
              "acct_arn.txt":     "arn:aws:iam::" + "947316205831" + ":role/gh-actions-deploy-role",
              "ecr_host.txt":     "947316205831" + ".dkr.ecr.ap-south-1.amazonaws.com/sih26104/gateway",
              "chain_key.env":    "AUDIT_CHAIN_KEY=" + "7c4bJqR9mZ2vTxL8wP3nH6yK1sD5gF0a",
              "db_url.txt":       "postgresql://sih:" + "Kq93mZ7vTxL8wP3n" + "@db.internal:5432/sih26104",
              # S-23 needs a name that is NOT in S-21's explicit list, so this fixture proves the
              # generic entropy rule fires on its own rather than being covered by S-21.
              "generic.py":       'API_KEY = "' + "Zx7QmV3pL9tR2yU6iO1aS4dF8gH0jK5n" + '"',
          }
          for name, body in positives.items():
              (fixture_dir / name).write_text(body + "\n", encoding="utf-8")

          # The negatives are copied from the shapes this repository's own documents and tests actually
          # use. If one of these ever fires, fix the detector — not the document.
          negatives = {
              "doc_placeholders.md": "\n".join([
                  "aws iam create-role --role-name gh-actions-deploy-role",
                  'arn:aws:iam::ACCOUNT_ID:oidc-provider/token.actions.githubusercontent.com',
                  'arn:aws:iam::<account-id>:role/gh-actions-deploy-role',
                  '"$ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com"',
                  '--secret-string "CHANGE_ME_$(openssl rand -hex 16)"',
                  'repo:<ORG>/sih26104-voice-integrity:*',
                  A + "IOSFODNN7EXAMPLE",
                  "gateway_image_digest=sha256:...",
              ]),
              "test_fixtures.py": "\n".join([
                  'AUDIT_CHAIN_KEY = "a" * 64',
                  'policy_bundle_sha256 = "b" * 64',
                  'proto_sha256 = "0" * 64',
                  'DB_PASSWORD = "your-password-here"',
                  'TICKET_SIGNING_KEY = "placeholder-not-a-real-key"',
              ]),
              "real_hashes.md": "\n".join([
                  "6e98e6edb9699c5d0737e144989cb2125edc519f8b7f828fa9f8213c9f79f4c5  contracts/openapi.yaml",
                  "7474da311511ee9dfab6e913e814247ee8f5dd3986b08fb51b43302ed8040a31  contracts/voice_scorer.proto",
              ]),
          }
          for name, body in negatives.items():
              (fixture_dir / name).write_text(body + "\n", encoding="utf-8")

          print(f"planted {len(positives)} positive and {len(negatives)} negative fixture file(s)")
          PY

          echo
          echo "--- POSITIVE: the detector must fire on the planted fakes ---"
          set +e
          python "$RUNNER_TEMP/scan/detect.py" --path "$FIX" > "$RUNNER_TEMP/selftest.out" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/selftest.out"

          if [ "$rc" -ne 1 ]; then
            echo "::error title=Detector self-test FAILED (positive)::The detector exited ${rc} on a directory full of planted fake credentials; 1 was expected. The scanner is not matching, which means every green secret-scan run since the breaking change proved nothing. Fix the patterns before merging anything."
            rm -rf "$FIX"; exit 1
          fi

          # Every rule that has a planted fixture must appear. A single catch-all match passing the whole
          # self-test would hide eight broken patterns behind one working one.
          missing=""
          for rule in S-01 S-02 S-03 S-04 S-06 S-07 S-20 S-21 S-22 S-23; do
            grep -q "\[${rule}/" "$RUNNER_TEMP/selftest.out" || missing="${missing} ${rule}"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Detector self-test FAILED (rule coverage)::These rules did not fire on their own planted fixture:${missing}. Each has a fixture in this step, so a miss is a broken pattern, not a missing test."
            rm -rf "$FIX"; exit 1
          fi
          echo "  ok  every planted fake credential was detected"

          echo
          echo "--- NEGATIVE: the detector must stay quiet on obviously-fake placeholders ---"
          NEG="$RUNNER_TEMP/selftest-neg"
          rm -rf "$NEG" && mkdir -p "$NEG"
          cp "$FIX/doc_placeholders.md" "$FIX/test_fixtures.py" "$FIX/real_hashes.md" "$NEG/"
          set +e
          python "$RUNNER_TEMP/scan/detect.py" --path "$NEG" > "$RUNNER_TEMP/selftest-neg.out" 2>&1
          rcneg=$?
          set -e
          cat "$RUNNER_TEMP/selftest-neg.out"
          if [ "$rcneg" -ne 0 ]; then
            echo "::error title=Detector self-test FAILED (negative)::The detector fired on the obviously-fake placeholders that rules.md R-34 REQUIRES this repository's documents to use. A scanner that reports ACCOUNT_ID and CHANGE_ME_ on every PR is a scanner the team learns to ignore, and then removes from branch protection."
            rm -rf "$FIX" "$NEG"; exit 1
          fi
          echo "  ok  no false positive on documented placeholders"

          # Fixtures deleted immediately. They are in $RUNNER_TEMP, never in the workspace, so they were
          # never candidates for `git add` — but leaving planted credential-shaped strings on a runner
          # that later uploads logs or artifacts is a habit worth not having.
          rm -rf "$FIX" "$NEG"
          echo
          echo "self-test passed in both directions; fixtures deleted"

      - name: Scan every tracked file
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/scan/detect.py" --git

      # ------------------------------------------------------------------------------------------------
      # History scan. Separate from the working-tree scan because it answers a different question:
      # "is there a credential in this repository" vs "was there ever one".
      #
      # A key committed on Tuesday and deleted on Wednesday is still in the pack file, still in every
      # clone, and still valid. The working-tree scan reports it clean. This one does not.
      #
      # Only the high-confidence credential shapes are run over history: the project-specific rules
      # (account ids, secret-name assignments) would fire on every intermediate edit of
      # aws-setup-instructions.md, and a history scan that reports fifty archaeological findings is a
      # history scan people stop reading. Findings here are a WARNING, not a failure — because the
      # remediation is rotation plus a history rewrite, which is a decision for a human, and blocking
      # every subsequent PR on it would make the gate the problem.
      # ------------------------------------------------------------------------------------------------
      - name: Scan history for credential shapes (advisory)
        run: |
          set -uo pipefail
          # Added lines only (-U0, lines starting with a single '+'), across every ref.
          # The alternation is built from fragments so this command does not match itself.
          PAT="(AKIA|ASIA)[0-9A-Z]{16}|-{5}BEGIN [A-Z ]*PRIVATE KEY-{5}|(ghp|ghs|gho)_[A-Za-z0-9]{36}|xox[abposr]-[A-Za-z0-9-]{10,}"
          hits="$(git log --all --no-color -U0 -p -- . 2>/dev/null \
                  | grep -E '^\+' \
                  | grep -Ev '^\+\+\+' \
                  | grep -E "$PAT" \
                  | sort -u | head -20 || true)"
          if [ -n "$hits" ]; then
            echo "::warning title=Credential shape found in git history::A credential shape appears in an added line somewhere in this repository's history. Even if the working tree is clean now, the object is still in the pack file and in every clone. ROTATE the credential first; a history rewrite without rotation is theatre."
            # Truncated so the value is not re-published in a log.
            printf '%s\n' "$hits" | cut -c1-60
            echo
            echo "Enumerate the commits with:"
            echo "  git log --all -p -S'<the-prefix>' --oneline"
          else
            echo "no credential shape in any added line across all refs"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### secret-scan"
            echo
            echo "Detector self-tested in both directions on this run: it fired on every planted fake"
            echo "credential and stayed quiet on the obviously-fake placeholders that rules.md R-34"
            echo "requires the documents to use. A green run here means the scanner ran and matched."
            echo
            echo "**What this does NOT find** (rules.md R-01, R-52):"
            echo "- a secret with no recognisable shape — a plain passphrase in a config value"
            echo "- a secret inside a binary, an image layer, or a minified vendor bundle"
            echo "- a secret in a git object no longer reachable from any ref"
            echo "- a secret that has already been used by someone else"
            echo
            echo "**And a green run un-leaks nothing.** Once a key reaches GitHub, rotation is the fix."
            echo "Deleting the line leaves the object in the history and in every clone."
          } >> "$GITHUB_STEP_SUMMARY"

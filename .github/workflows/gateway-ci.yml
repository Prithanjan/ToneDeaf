# Gateway CI — lint, type-check, unit tests, and (on `main` only) build + push to ECR.
#
# WHAT THIS WORKFLOW MAY AND MAY NOT DO
# ------------------------------------
# It may push an image. It may NOT start anything. There is no `aws ecs update-service` in this file
# and there must never be one: rules.md R-29 says no `git push` can start GPU spend, and the only way
# to keep that true is for the build pipeline to have no vocabulary for scaling. The single path that
# raises a desired count is .github/workflows/deploy-runtime.yml, on workflow_dispatch.
#
# WHY ONE WORKFLOW PER SERVICE, PATH-FILTERED
# -------------------------------------------
# rules.md R-56. If one workflow rebuilt every service on every merge, a PWA copy-edit would produce a
# new gateway image digest. A release manifest that recorded the previous digest would then name bytes
# that no longer correspond to any deliberate change — the manifest stops describing what is running,
# which is the exact failure R-51 exists to prevent. Path filters make "which images could this commit
# possibly have changed" answerable by reading the diff.
#
# `contracts/**` is in the filter because the Gateway hashes contracts/openapi.yaml and
# contracts/voice_scorer.proto into the parity set it serves at /api/v1/version. A contracts change
# with no gateway change still produces a different image, and must.
#
# `scripts/gen_proto.sh` is in the filter for a less obvious reason, and it was missing until it was
# noticed. That script writes generated stubs into BOTH gateway/app/scorer/ and scorer/app/
# (scripts/gen_proto.sh:146-148), including a post-protoc import fixup that rewrites
# `import voice_scorer_pb2` to `from . import voice_scorer_pb2`. So editing the generator alone — no
# proto change, no gateway change — changes what the *gateway's* committed stubs ought to be. The
# "Regenerate protobuf stubs and assert no drift" step below is the only place in this repository that
# diffs gateway/app/scorer; scorer-ci.yml already listed the script in its own filter and covers the
# other half. Without this line, a lone edit to the generator ran the Scorer's drift check and skipped
# the Gateway's, which is the asymmetry that makes a stale stub survive: the proto still compiles, both
# services still import, and the field the Gateway sets is a field the Scorer stopped reading.
#
# AUTHENTICATION: OIDC ONLY
# -------------------------
# rules.md R-55. There is no AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY anywhere in this repository's
# secrets, and adding one would defeat the control rather than supplement it. The build job requests
# `id-token: write` and assumes gh-actions-deploy-role for the duration of the run; the token expires
# with the job. A long-lived key in repo secrets is readable by every workflow, including one added
# later by someone who did not read this comment.
name: gateway-ci

on:
  pull_request:
    paths:
      - "gateway/**"
      - "contracts/**"
      - "scripts/gen_proto.sh"
      - ".github/workflows/gateway-ci.yml"
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "contracts/**"
      - "scripts/gen_proto.sh"
      - ".github/workflows/gateway-ci.yml"
  # Manual runs exist so a build can be re-driven for a commit whose image was garbage-collected by the
  # ECR lifecycle policy (keep-last-15) without pushing an empty commit.
  workflow_dispatch:

# Least privilege at the top, elevated per job. A workflow-level `id-token: write` would hand an
# assumable AWS identity to the lint job, which has no reason to hold one.
permissions:
  contents: read

concurrency:
  group: gateway-ci-${{ github.ref }}
  # Cancel superseded PR runs (cheap, and the newer commit is the one that matters). Do NOT cancel on
  # `main`: a cancelled run mid-`docker push` leaves a partially uploaded manifest, and the next run
  # cannot overwrite it because the ECR repositories are IMMUTABLE.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to exact published versions rather than floating majors. NOTE HONESTLY: a
      # tag is still mutable by its publisher, and the hardened form is a 40-hex commit SHA. Resolving
      # those requires network access to GitHub, which was not available when this file was authored,
      # so it is a Phase 0 follow-up:
      #   gh api repos/actions/checkout/git/ref/tags/v4.2.2 --jq .object.sha
      # Until then this is version pinning, not supply-chain pinning, and it should not be described as
      # the latter (rules.md R-01).
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          # 3.12, not 3.14. Decision D-10: webrtcvad-wheels and onnxruntime do not have assured 3.14
          # wheels, and gateway/Dockerfile pins python:3.12-slim. CI running a different interpreter
          # than the image means a passing lint run proves nothing about the artifact.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt

      # The source plan writes `pip install -r requirements.txt --break-system-packages`. That flag is
      # deliberately NOT used here, and this is the note rules.md R-52 asks for. `--break-system-packages`
      # exists to override PEP 668 on a distro-managed interpreter; actions/setup-python provides a
      # standalone interpreter that is not externally managed, so the flag is a no-op that also disables
      # a genuine guard rail for anyone who copies this line onto a runner where it is NOT a no-op.
      - name: Install dev dependencies
        working-directory: gateway
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ruff and mypy are separate steps, not `&&`, so the log tells you which one failed without
      # scrolling. `--output-format=github` turns findings into inline PR annotations.
      - name: ruff (lint)
        working-directory: gateway
        run: ruff check --output-format=github .

      - name: ruff (format check)
        working-directory: gateway
        run: ruff format --check --diff .

      # mypy is strict for this service (gateway/pyproject.toml). It is a privacy control as much as a
      # correctness one: an `Any` crossing the logging boundary is how a PCM buffer reaches a log line
      # with the ALLOWED_EXTRA_KEYS filter as the only thing left standing (rules.md R-14, R-18).
      - name: mypy (strict)
        working-directory: gateway
        run: mypy app

  test:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt

      - name: Install dev dependencies
        working-directory: gateway
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The generated protobuf stubs are committed, but regenerating proves the committed copies match
      # contracts/voice_scorer.proto. A stale stub is the failure mode where the Gateway compiles, the
      # Scorer compiles, and the field the Gateway sets is a field the Scorer stopped reading.
      # scripts/gen_proto.sh is owned by the Scorer pair; this only invokes it.
      - name: Regenerate protobuf stubs and assert no drift
        run: |
          set -euo pipefail
          ./scripts/gen_proto.sh
          if ! git diff --quiet -- gateway/app/scorer; then
            echo "::error title=Stale protobuf stubs::gateway/app/scorer differs from what gen_proto.sh produces from contracts/voice_scorer.proto. Run scripts/gen_proto.sh and commit the result."
            git --no-pager diff --stat -- gateway/app/scorer
            exit 1
          fi
          echo "committed stubs match contracts/voice_scorer.proto"

      # `integration` is deselected, not deleted: those tests need Postgres and a live Scorer. Marking
      # them and excluding them here keeps the unit job under a minute, which is what makes it a gate
      # people leave switched on. The integration suite runs in contract-check.yml's Compose job.
      # -m 'not integration' plus --strict-markers (pyproject) means a typo in a marker name fails
      # loudly instead of silently selecting nothing and reporting green.
      - name: pytest (unit, excluding integration)
        working-directory: gateway
        run: pytest -m "not integration" --cov=app --cov-report=term-missing

  build-push:
    name: build and push gateway image
    # Merge to `main` only. A PR from a fork must never be able to write to ECR — the OIDC trust policy
    # currently matches `repo:<org>/sih26104-voice-integrity:*`, which includes pull_request refs
    # (aws-setup-instructions.md section 3.2 flags this and asks for it to be tightened before the
    # demo). Until that tightening lands, THIS `if` is the control that stops a fork PR from pushing an
    # image, so do not relax it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-24.04
    env:
      # Region is pinned as a literal in every AWS-touching job, never inherited and never read from a
      # repo variable. `${{ vars.AWS_REGION }}` expands to the empty string if the variable was never
      # set, and configure-aws-credentials with an empty region falls back to the runner's ambient
      # default — which is not ap-south-1. A wrong region does not fail; it succeeds against the wrong
      # account resources, or creates them.
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: sih26104/gateway
    permissions:
      contents: read
      id-token: write # rules.md R-55: this is what makes OIDC work. Without it you get a confusing
      # "Credentials could not be loaded" that reads like a missing secret.
    outputs:
      # The whole point of this job. deploy-runtime.yml consumes a digest, never a tag (rules.md R-56).
      image_digest: ${{ steps.resolve.outputs.digest }}
      image_uri: ${{ steps.resolve.outputs.uri }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Assume gh-actions-deploy-role via OIDC
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: gateway-ci-${{ github.run_id }}
          # Short session: this job pushes one image and exits. An hour-long session is an hour-long
          # window if the runner is compromised mid-run.
          role-duration-seconds: 1800

      - name: Fail early if the deploy role variable is unset
        # configure-aws-credentials with an empty role-to-assume produces an error that reads like an
        # AWS trust-policy problem, and people go and edit the trust policy. It is not: the repo
        # variable was never set (aws-setup-instructions.md section 3.3).
        run: |
          set -euo pipefail
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "::error title=AWS_DEPLOY_ROLE_ARN is not set::Set it with: gh variable set AWS_DEPLOY_ROLE_ARN --body arn:aws:iam::<account-id>:role/gh-actions-deploy-role"
            exit 1
          fi
          aws sts get-caller-identity --query Arn --output text

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      # ---------------------------------------------------------------------------------------------
      # R-56 IN PRACTICE: if this commit already has an image, do not build a second one.
      #
      # The ECR repositories are IMMUTABLE, so a re-run for the same commit cannot overwrite the tag —
      # `docker push` would simply fail with an opaque error. More importantly, rebuilding is the wrong
      # answer even when it is possible: two builds of the same source produce different bytes (build
      # timestamps, apt mirror state, wheel resolution order), so a rebuild silently invalidates a
      # digest that a release manifest may already name. Reusing the existing digest is not a shortcut
      # around a broken tag policy; it IS promotion-by-digest.
      # ---------------------------------------------------------------------------------------------
      - name: Check whether this commit already has an image
        id: existing
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -uo pipefail
          digest="$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"
          if [ -n "$digest" ] && [ "$digest" != "None" ]; then
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "Image for ${IMAGE_TAG} already exists: ${digest} — reusing it, NOT rebuilding (rules.md R-56)."
          else
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "No image for ${IMAGE_TAG} yet; will build."
          fi

      - name: Set up Buildx
        if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@v3.7.1

      - name: Build and push
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6.10.0
        with:
          # Build context is the REPO ROOT, not gateway/. gateway/Dockerfile COPYs contracts/ so the
          # image can hash its own contract files at startup; a gateway/-scoped context cannot reach
          # them. Getting this wrong produces a build failure, not a silently wrong image — which is
          # the correct direction for a mistake this easy to make.
          context: .
          file: gateway/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          # Immutable tags mean `latest` cannot be moved, so there is no `latest`. Anything that wants
          # "the current gateway" resolves it from the release manifest, not from a floating tag.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # provenance/sbom OFF on purpose. With them on, Buildx pushes an OCI *index* and
          # `imageDigest` becomes the index digest rather than the image manifest digest. ECS can pull
          # an index, but the digest recorded in a release manifest would then not be the digest of the
          # thing that runs, and the parity claim in architecture.md 5.1 depends on those being the
          # same string. One artifact, one unambiguous digest.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

      - name: Resolve the digest to promote
        id: resolve
        run: |
          set -euo pipefail
          digest="${{ steps.existing.outputs.digest }}"
          if [ -z "$digest" ]; then
            digest="${{ steps.build.outputs.digest }}"
          fi
          # Fail closed. An empty digest downstream would be interpreted as "no override" by a deploy
          # step and would quietly ship whatever the task definition already pointed at.
          case "$digest" in
            sha256:*) : ;;
            *)
              echo "::error title=No image digest::Neither the pre-existing image lookup nor the build produced a sha256: digest. Refusing to emit an empty promotion target."
              exit 1
              ;;
          esac
          uri="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "uri=${uri}" >> "$GITHUB_OUTPUT"

      # Written to the run summary because this string is the input a human types into
      # deploy-runtime.yml. Making it copy-pasteable from the run page is the difference between
      # promotion-by-digest being the policy and it being the path of least resistance.
      - name: Record the digest in the run summary
        run: |
          {
            echo "### gateway image built"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| repository | \`${{ env.ECR_REPOSITORY }}\` |"
            echo "| digest | \`${{ steps.resolve.outputs.digest }}\` |"
            echo "| rebuilt | ${{ steps.existing.outputs.digest == '' && 'yes (new commit)' || 'no — reused existing digest (R-56)' }} |"
            echo
            echo "Promote with **this digest**, never a tag:"
            echo
            echo '```'
            echo "gh workflow run deploy-runtime.yml \\"
            echo "  -f gateway_image_digest=${{ steps.resolve.outputs.digest }} \\"
            echo "  -f scorer_image_digest=sha256:... \\"
            echo "  -f confirm_cost_aware='I understand this starts GPU spend'"
            echo '```'
            echo
            echo "> Nothing was deployed by this run. Pushing an image does not start spend (rules.md R-29)."
          } >> "$GITHUB_STEP_SUMMARY"

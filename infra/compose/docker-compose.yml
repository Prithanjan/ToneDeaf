# Local CPU tier — the integration harness, not a second product.
#
# Runs the same application source, contract, schema, policy bundle, model, and calibration artifact
# as AWS. The tier is configuration, not a branch (rules.md R-04). What differs is enumerated and
# bounded: the execution provider (CPUExecutionProvider here, CUDAExecutionProvider on ECS), the
# Scorer image (`onnxruntime` vs `onnxruntime-gpu` — the documented parity exception, architecture.md
# §5.1), and the ingress (Caddy here, CloudFront + internal ALB on AWS). Nothing else.
#
#   docker compose -f infra/compose/docker-compose.yml up --build
#
# ── Things that are controls, not conveniences ────────────────────────────────────────────────────
#
# * **Caddy is the only service that publishes a host port.** gateway, scorer, and postgres are
#   reachable only on the internal network. This mirrors the AWS posture (architecture.md §4.2:
#   deny-by-default, Scorer reachable only from the Gateway SG) so that a local run cannot pass while
#   depending on an access path that does not exist in the deployed topology.
# * **The build context is the repo root** (`../..`), not this directory. Both Dockerfiles COPY from
#   `contracts/`, which they hash into the parity set. Building from `gateway/` cannot work — that was
#   a real defect (memory.md BUG-2), and the same context is required for anything else that needs the
#   contract files.
# * **The Gateway runs exactly one Uvicorn worker.** That comes from the image CMD and it is
#   correctness, not tuning: session state, the ticket replay cache, and the per-session audit chain
#   head are all in-process. A second worker forks the hash chain and produces an audit trail that
#   fails verification with no bug anywhere in the chain code (memory.md DEV-2).
# * **No volume mounts audio anywhere.** There is no bind mount into which PCM could be written, by
#   design (rules.md R-14). The only writable volume is the Postgres data directory.
# * **`SCORER_TARGET` uses the service name `scorer`.** On AWS the same variable holds
#   `scorer.sih26104.local` from Cloud Map. One variable, two values, no code difference.
#
# ⚠️ **Never `docker compose exec caddy caddy reload` during a live stream.** Caddy closes open
# WebSockets on config reload, which kills a demo session mid-decision.

name: sih26104

services:
  # ── Ingress ─────────────────────────────────────────────────────────────────────────────────────
  # The only published port. Terminates TLS with a mkcert certificate, because getUserMedia requires
  # a secure context and the PWA cannot capture audio over plain http on a non-localhost host.
  caddy:
    image: caddy:2.8-alpine
    container_name: sih26104-caddy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # mkcert output. Generated by the operator, never committed — see certs/README.md.
      - ./certs:/etc/caddy/certs:ro
      # Built PWA assets. `pnpm -C pwa build` must have run; Caddy serves them statically, exactly as
      # CloudFront serves them from S3 on AWS.
      - ../../pwa/dist:/srv/pwa:ro
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - edge
      - app

  # ── Application ─────────────────────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown-local}
    image: sih26104/gateway:local
    container_name: sih26104-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # `local-cpu`, not `local`. The enum has exactly two members — `local-cpu` and `aws-gpu`
      # (gateway/app/config.py:28) — and pydantic rejects anything else at startup rather than
      # defaulting. There is deliberately no `aws-cpu`: the CPU tier is a *local* parity tier.
      DEPLOYMENT_PROFILE: local-cpu
      # Advisory only. The Gateway does not choose the provider; it reports what the Scorer told it,
      # and a mismatch against the expected provider is a failed deploy on AWS (rules.md R-45).
      EXECUTION_PROVIDER: CPUExecutionProvider
      SCORER_TARGET: scorer:50051
      # `postgresql://`, NOT `postgresql+asyncpg://`. This is not a style preference and it is not
      # interchangeable — the `+driver` suffix is SQLAlchemy dialect syntax, and the Gateway does not use
      # SQLAlchemy. It calls `asyncpg.create_pool()` directly (gateway/app/main.py:153), and asyncpg
      # 0.30.0 validates the scheme itself:
      #
      #     if parsed.scheme not in {'postgresql', 'postgres'}:
      #         raise ValueError('invalid DSN: scheme is expected to be either "postgresql" or
      #                           "postgres", got {!r}')
      #
      # So `postgresql+asyncpg://` is a hard startup crash, not a warning. The `migrate` service below
      # uses the same value because alembic normalizes whatever it is given UP to `postgresql+asyncpg://`
      # (audit/migrations/env.py:57) — so `postgresql://` is the one form both consumers accept, and it is
      # what the `sih26104/database-url` secret must hold on ECS too. Keeping it identical in both places
      # also means the normalization path in env.py runs on every local migration instead of being dead
      # code that rots unnoticed.
      DATABASE_URL: postgresql://sih26104:${POSTGRES_PASSWORD}@postgres:5432/sih26104
      ALLOWED_ORIGINS: https://sih26104.local
      POLICY_BUNDLE_PATH: /policy/policy.yaml
      CALIBRATION_PATH: /policy/calibration.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Read-only, and mounted rather than baked so a policy change is a restart instead of a rebuild.
      # The Gateway hashes the bundle into the parity set on startup, so a swapped file is visible in
      # the banner rather than silent.
      - ../../policy:/policy:ro
    depends_on:
      postgres:
        condition: service_healthy
      scorer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /healthz is liveness only. /readyz additionally requires the Scorer and the DB, so using it
      # here would deadlock against depends_on.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - app

  scorer:
    build:
      context: ../..
      dockerfile: scorer/Dockerfile
      args:
        # The CPU tier. `onnxruntime`, not `onnxruntime-gpu` — this single argument is the whole
        # difference between the two Scorer images, and it is why they cannot be byte-identical and
        # therefore live in separate ECR repositories (sih26104/scorer-cpu vs sih26104/scorer-gpu).
        ORT_PACKAGE: onnxruntime
        ORT_VERSION: "1.20.0"
        CUDA_PIP_PACKAGES: ""
        GIT_COMMIT: ${GIT_COMMIT:-unknown-local}
    image: sih26104/scorer-cpu:local
    container_name: sih26104-scorer
    restart: unless-stopped
    environment:
      # See the Gateway's note: `local-cpu`, not `local`. Both tiers read the same two-member enum
      # (scorer/app/config.py:45), so a value that works for one works for the other by construction.
      DEPLOYMENT_PROFILE: local-cpu
      EXECUTION_PROVIDER: CPUExecutionProvider
      # MOCK_SMOKE_MODE_NOT_A_DETECTOR until a real ONNX artifact exists. The name is deliberately
      # unwieldy: it appears in every gRPC response and every audit row, so a mock score cannot be
      # mistaken for a measurement (memory.md U-8) or quoted in a report without the label attached.
      DETECTOR_MODE: ${DETECTOR_MODE:-MOCK_SMOKE_MODE_NOT_A_DETECTOR}
      # `research_only`, not `placeholder`. The enum comes from the release manifest
      # (scorer/app/config.py:66) and has three members: research_only / demo_eligible /
      # policy_eligible. `research_only` is the correct state for a build with no trained artifact —
      # and it is the state that must never be shown to a judge as a detection result (R-37).
      ARTIFACT_STATE: ${ARTIFACT_STATE:-research_only}
      CALIBRATION_PATH: /policy/calibration.json
      GRPC_PORT: "50051"
      # One stream, 2.56 s windows on a 640 ms hop → ~1.6 scores/s. Two workers is headroom for the
      # demo, not a throughput claim; the CPU p95 sweep (H-4) is what would justify a number.
      GRPC_MAX_WORKERS: ${GRPC_MAX_WORKERS:-2}
      ORT_INTRA_OP_THREADS: ${ORT_INTRA_OP_THREADS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ../../policy:/policy:ro
      # Present only when a real model exists. Until then the Scorer runs in mock mode and this mount
      # is empty, which is the honest state rather than a hidden fallback.
      - ../../ml/models:/models:ro
    healthcheck:
      # The application's own entrypoint, not a reimplementation of it here. `app.server
      # --healthcheck` opens a real gRPC channel to the loopback and calls the contract's `Health`
      # RPC, so "the port is open" cannot pass for "the service works" — a Scorer with an unloaded
      # model or a raising servicer fails this. `grpc_health_probe` is deliberately absent: adding a
      # Go binary to a Python image to duplicate an RPC the contract already defines is not worth the
      # image size.
      #
      # ⚠️ This asserts `ready` and nothing else. It does **not** assert `execution_provider` or
      # `contract_vector_parity_ok`, both of which `HealthResponse` carries. That is a real gap on the
      # GPU tier, where a silent CUDA→CPU fallback (rules.md R-45) comes up *healthy* and produces
      # numbers — the worst failure shape available, because it looks like a success. Tracked as a
      # finding against `scorer/app/server.py:528`, which owns the fix; asserting it from this YAML
      # would put a second implementation of the health contract in a place nobody looks when it
      # drifts.
      test: ["CMD", "python", "-m", "app.server", "--healthcheck"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 20s
    networks:
      - app

  # ── One-shot migration ──────────────────────────────────────────────────────────────────────────
  # A separate service rather than an entrypoint hook, so a failed migration fails *visibly* and the
  # Gateway never starts against a schema it does not match. On AWS this is the `gateway-migrate`
  # one-shot task definition from ComputeStack — same image, same command.
  #
  # It depends on postgres ONLY. `gateway` depends on *this* completing successfully, so adding a
  # dependency in the other direction would be a cycle Compose refuses to start.
  #
  # The build stanza is repeated rather than inherited: Compose only builds services that declare
  # `build`, and with an identical context, dockerfile, and args this is a full cache hit — the cost
  # is nil and the alternative is a service that fails on a clean checkout because nothing built its
  # image yet.
  migrate:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown-local}
    image: sih26104/gateway:local
    container_name: sih26104-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Identical to the gateway service's value on purpose — see the long note there. Alembic rewrites
      # this to `postgresql+asyncpg://` itself (audit/migrations/env.py:57) and prints a line saying so,
      # so passing the plain scheme exercises that normalization on every local migration run rather than
      # leaving it as untested code. Do not "correct" it to the +asyncpg form.
      DATABASE_URL: postgresql://sih26104:${POSTGRES_PASSWORD}@postgres:5432/sih26104
    volumes:
      # `script_location = %(here)s` in alembic.ini, so the ini resolves its own directory and this
      # mount is all the wiring needed. Read-only: a migration run must not mutate the repo.
      - ../../audit:/app/audit:ro
    command: ["alembic", "-c", "/app/audit/migrations/alembic.ini", "upgrade", "head"]
    restart: "no"
    networks:
      - app

  # ── Data ────────────────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sih26104-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sih26104
      POSTGRES_USER: sih26104
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Deterministic collation. A different sort order between local and RDS would change the row
      # order the hash-chain verifier walks, and the chain is order-dependent.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih26104 -d sih26104"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - app

networks:
  # Split so that "only Caddy is public" is a property of the topology rather than of the ports list.
  # Nothing on `app` is reachable from the host.
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: false # gateway/scorer need egress for pip during build; no ingress is published

volumes:
  # The only writable volume in the stack. Audit rows are durable; audio is not, anywhere
  # (rules.md R-14).
  pgdata:
